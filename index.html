<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prüfungstrainer TBW</title>
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Lern-App: oben Kopf mit Countdown, Mitte Inhalt, unten Navigation am Daumen */
:root{
  --bg:#0b0f14; --panel:#131a22; --panel2:#18212b; --line:#243040; --fg:#e8edf2; --dim:#8a97a6;
  --accent:#ffb020; --bad:#ff5a5a; --mid:#ffb020; --ok:#3ccf8e; --link:#6cb6ff;
  --vwl:#6cb6ff; --rewe:#3ccf8e; --ma:#ff8a4c;
  --txt:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --num:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f1ea; --panel:#ffffff; --panel2:#f9f7f2; --line:#ddd6c8; --fg:#1d232a; --dim:#66707b;
    --accent:#c77a00; --bad:#c9302c; --mid:#b26b00; --ok:#1f8a5b; --link:#1f64b8;
    --vwl:#1f64b8; --rewe:#1f8a5b; --ma:#c25617; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f4f1ea; --panel:#ffffff; --panel2:#f9f7f2; --line:#ddd6c8; --fg:#1d232a; --dim:#66707b;
  --accent:#c77a00; --bad:#c9302c; --mid:#b26b00; --ok:#1f8a5b; --link:#1f64b8;
  --vwl:#1f64b8; --rewe:#1f8a5b; --ma:#c25617; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--txt);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) 0 0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#1a1100;font-weight:700}
button.ghost{background:transparent}
button.small{padding:7px 10px;font-size:14px;border-radius:10px}
button:disabled{opacity:.4}
select,input[type=date],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{width:100%;min-height:110px;resize:vertical;line-height:1.45}

header{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
header h1{font:700 17px/1.2 var(--txt);margin:0;flex:1;letter-spacing:.01em}
.chip{font-size:12px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}

main{flex:1;min-height:0;overflow:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
main > *{max-width:720px;margin-left:auto;margin-right:auto}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--panel);
  padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;padding:8px 2px 6px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--accent)}

h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:18px 0 8px;color:var(--dim);font-weight:600;letter-spacing:.02em}
.muted{color:var(--dim)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.big{font:700 34px/1.1 var(--num);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi .v{font:700 24px/1.1 var(--num);font-variant-numeric:tabular-nums}
.kpi .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.f-vwl{color:var(--vwl)} .f-rewe{color:var(--rewe)} .f-ma{color:var(--ma)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{padding:8px 12px;font-size:14px;border-radius:99px;white-space:nowrap;color:var(--dim)}
.seg button[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.mid{background:var(--mid)} .dot.bad{background:var(--bad)}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* Karteikarte */
.flash .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-bottom:10px}
.flash .q{font-size:19px;font-weight:650;line-height:1.35}
.flash .a{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:15.5px}
.flash .a .src{margin-top:12px;font-size:12.5px;color:var(--dim)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;bottom:0;padding:10px 0 0;background:linear-gradient(transparent,var(--bg) 30%)}
.rate button{padding:14px 6px;font-weight:700}
.rate .r0{border-color:var(--bad);color:var(--bad)}
.rate .r1{border-color:var(--mid);color:var(--mid)}
.rate .r2{border-color:var(--ok);color:var(--ok)}

/* Aufgaben (Markdown) */
.md{font-size:15.5px;overflow-wrap:anywhere}
.md p{margin:.55em 0}
.md ul,.md ol{margin:.4em 0;padding-left:1.3em}
.md li{margin:.2em 0}
.md h4{margin:1em 0 .4em;font-size:15px}
.md blockquote{margin:.6em 0;padding:.4em .8em;border-left:3px solid var(--line);color:var(--dim)}
.md code{font-family:ui-monospace,Consolas,monospace;font-size:.92em}
.tbl{overflow-x:auto;margin:.6em 0;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:normal;word-break:normal;hyphens:auto;min-width:5.5em}
.tbl th{background:var(--panel2)}
.tbl tr:last-child td{border-bottom:0}
.teil{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.teil > .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.teil > .hd b{font-size:15px}
.loes{margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:10px;padding:4px 12px}
.score{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.score .val{font:700 20px var(--num);min-width:4.5ch;text-align:center;font-variant-numeric:tabular-nums}
.timer{position:sticky;top:-14px;z-index:2;background:var(--bg);padding:8px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.timer .big{font-size:26px}
.timer.warn .big{color:var(--bad)}
.note{font:800 64px/1 var(--num)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:9;max-width:90vw;text-align:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--dim)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center}
</style>
</head>
<body>
<header>
  <h1 id="title">Prüfungstrainer TBW</h1>
  <span class="chip" id="countdown" hidden></span>
</header>
<main id="main" aria-live="polite"></main>
<nav id="nav" hidden>
  <button data-go="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Heute</button>
  <button data-go="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>Karten</button>
  <button data-go="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6M8 4H6a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-2"/><path d="M9 12l2 2 4-4"/></svg>Aufgaben</button>
  <button data-go="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Fortschritt</button>
</nav>
<input type="file" id="file" accept=".md,.txt,.json,text/plain,text/markdown,application/json" multiple hidden>
<script src="parse.js"></script>
<script src="app.js"></script>
</body>
</html>
